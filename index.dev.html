<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#f59e0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <title>[DEV] Apex Squad Tracker</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-zoom/2.0.1/chartjs-plugin-zoom.min.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#121418;--card:#1b1e24;--fg:#eceef2;--mut:#8f96a3;--bd:#2b303b;--acc:#e0463a;--up:#1ea653;--down:#e0463a;--warn:#e5a93b}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{font:14px/1.45 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg);max-width:960px;margin:0 auto;padding:14px 14px 76px}
    h1{font-size:20px;margin:0}
    h2{font-size:15px;margin:0 0 10px;font-weight:600}
    .mut{color:var(--mut);font-size:12px}
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
    .dev-pill{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.6px;padding:2px 6px;border-radius:5px;background:rgba(245,158,11,.18);color:#f59e0b;border:1px solid rgba(245,158,11,.45);vertical-align:middle;margin-left:6px}
    .refresh-btn{background:var(--card);border:1px solid var(--bd);color:var(--fg);padding:6px 12px;border-radius:8px;font-size:13px;cursor:pointer}
    .range-btn,.ov-range-btn{padding:4px 8px;font-size:11px}
    .range-btn.active,.ov-range-btn.active{border-color:var(--acc);color:var(--acc);font-weight:700}
    .season-bar{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .season-bar select{padding:6px 9px;font-size:13px;min-width:130px}
    .split-info{flex-basis:100%;font-size:11px;color:var(--mut);display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:6px;border-top:1px dashed var(--bd)}
    .split-info b{color:var(--fg);font-weight:600}
    .split-countdown{font-weight:700;color:var(--warn);white-space:nowrap}
    .split-countdown.ended{color:var(--mut);font-weight:600}
    .map-bar{background:var(--card);background-size:cover;background-position:left center;border:1px solid var(--bd);border-radius:12px;min-height:84px;padding:12px 16px;margin-bottom:12px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;text-align:right;gap:2px;position:relative;overflow:hidden}
    .map-bar.has-bg{border-color:rgba(255,255,255,.18);text-shadow:0 1px 4px rgba(0,0,0,.95)}
    .map-kicker{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--acc)}
    .map-title{font-size:19px;font-weight:800;line-height:1.15;color:#fff;letter-spacing:-.2px}
    .map-sub{font-size:11px;color:var(--mut);margin-top:2px}
    .map-bar.has-bg .map-sub{color:#d1d6e0}
    .nav-bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:100}
    .tab{border:0;background:transparent;color:var(--mut);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;flex:1}
    .tab span{font-size:18px}
    .tab.active{color:var(--acc)}
    .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    select{font:inherit;padding:8px 10px;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:8px;flex:1;min-width:140px}
    .kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
    @media(min-width:600px){.kpi-grid{grid-template-columns:repeat(5,1fr)}}
    .kpi{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
    .kpi-title{font-size:11px;color:var(--mut);text-transform:uppercase}
    .kpi-val{font-size:20px;font-weight:700;margin-top:2px}
    .up{color:var(--up);font-weight:600}.down{color:var(--down);font-weight:600}
    table{border-collapse:collapse;width:100%}
    td,th{border-bottom:1px solid var(--bd);padding:8px 6px;text-align:left;font-size:13px;vertical-align:middle}
    th{color:var(--mut);font-size:11px;text-transform:uppercase}
    .group-row td{background:var(--bg);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--acc);padding:10px 8px;border-top:1px solid var(--bd)}
    .wrap{overflow-x:auto}
    .day-header{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--acc);padding:10px 4px 6px;margin-top:8px;border-bottom:1px solid var(--bd);margin-bottom:8px}
    .day-header:first-child{margin-top:0;padding-top:2px}
    .match-card{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
    .time-pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--fg);background:var(--card);border:1px solid var(--bd);padding:2px 7px;border-radius:6px;margin-top:4px;font-variant-numeric:tabular-nums}
    .badge{display:inline-block;padding:3px 8px;border-radius:8px;font-size:12px;font-weight:700;background:var(--card);border:1px solid var(--bd)}
    .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
    .dot-game{background:var(--up);box-shadow:0 0 6px var(--up)}
    .dot-lobby{background:var(--warn)}
    .dot-off{background:#5c6370}
    .status-line{display:flex;align-items:center;font-size:11px;color:var(--mut);margin-top:2px}
    .rank-icon{width:34px;height:34px;object-fit:contain;vertical-align:middle;display:block}
    .player-meta{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
    .prog-wrap{width:100%;max-width:220px}
    .prog-bar{height:6px;background:var(--card);border-radius:4px;overflow:hidden;margin-top:4px;border:1px solid var(--bd)}
    .prog-fill{height:100%;background:var(--acc);border-radius:4px}
    .tips-wrap{margin-top:12px;padding-top:12px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:8px}
    .tip-box{background:var(--bg);border:1px solid var(--bd);border-left:3px solid var(--warn);border-radius:8px;padding:9px 11px;font-size:13px}
    .tip-box.tip-rp{border-left-color:var(--down)}
    .tip-box.tip-kills{border-left-color:var(--warn)}
    .tip-box.tip-good{border-left-color:var(--up)}
    .tip-box.tip-idle{border-left-color:#b1c3c4}
    .tip-head{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);margin-bottom:2px;display:flex;justify-content:space-between}
    .tip-box.tip-overtime{background:rgba(224,70,58,.12);border:1px solid rgba(224,70,58,.45);border-left:4px solid var(--acc);box-shadow:0 0 12px rgba(224,70,58,.15)}
    .tip-box.tip-overtime .tip-head{color:#ff7b72}
    .badges-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--bd)}
    .hist-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--card);border:1px solid var(--bd);color:var(--fg)}
    .hidden{display:none!important}
  </style>
</head>
<body>

<div class="header">
  <div>
    <h1>Apex Squad Tracker<span class="dev-pill">DEV</span></h1>
    <div class="mut" id="sub">Caricamento dati...</div>
  </div>
  <button class="refresh-btn" onclick="loadData()">&#x21bb; Aggiorna</button>
</div>

<div class="season-bar" id="season-bar">
  <span style="font-size:12px;font-weight:700;color:var(--mut)">&#x1F3C6; Stagione</span>
  <select id="season-select" onchange="onSeasonChange()"></select>
  <select id="split-select" onchange="onSplitChange()"></select>
  <div class="split-info hidden" id="split-info"></div>
</div>

<div class="map-bar hidden" id="map-bar"></div>

<!-- TAB 1: Squadra -->
<div id="tab-compare">
  <div class="card">
    <h2>Panoramica Squadra</h2>
    <div class="wrap"><table>
      <thead><tr><th>Giocatore</th><th>Grado</th><th>RP</th><th>RP Oggi</th><th>Kill</th><th>Partite</th></tr></thead>
      <tbody id="compare-table"></tbody>
    </table></div>
    <div id="squad-tips" class="tips-wrap hidden"></div>
  </div>
  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <h2 style="margin:0">Andamento RP</h2>
      <div class="row" style="gap:4px">
        <button class="refresh-btn range-btn active" onclick="setCompareRange(1, this)">24h</button>
        <button class="refresh-btn range-btn" onclick="setCompareRange(2, this)">48h</button>
        <button class="refresh-btn range-btn" onclick="setCompareRange(7, this)">7gg</button>
        <button class="refresh-btn range-btn" onclick="setCompareRange(30, this)">30gg</button>
        <button class="refresh-btn range-btn" onclick="setCompareRange(0, this)">Stagione / Tutto</button>
      </div>
    </div>
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <label class="row mut" style="font-size:12px;cursor:pointer;gap:6px">
        <input type="checkbox" id="compare-relative" onchange="renderCompare()">
        Confronta variazione (±0 RP)
      </label>
      <label class="row mut" style="font-size:12px;cursor:pointer;gap:6px">
        <input type="checkbox" id="compare-compact" onchange="renderCompare()" checked>
        Comprimi pause
      </label>
      <button class="refresh-btn" style="padding:3px 8px;font-size:11px" onclick="compareChart && compareChart.resetZoom()">Reset zoom</button>
    </div>
    <div style="height:420px;position:relative;touch-action:pan-y"><canvas id="chart-compare"></canvas></div>
  </div>
</div>

<!-- TAB 2: RESOCONTO -->
<div id="tab-recap" class="hidden">
  <div class="card">
    <div class="row" style="margin-bottom:10px">
      <select id="player-recap"></select>
      <select id="period-recap">
        <option value="day">Oggi</option>
        <option value="yesterday">Ieri</option>
        <option value="week">Questa settimana</option>
        <option value="month">Questo mese</option>
        <option value="season">Intera selezione (Stagione / Split)</option>
      </select>
    </div>
    <div class="player-meta" id="recap-meta"></div>
    <div id="recap-badges" class="card hidden" style="padding:10px 12px;margin-bottom:12px;background:var(--bg)"></div>
    <div class="kpi-grid" id="recap-kpis"></div>
    <div class="wrap"><table><thead><tr><th>Statistica</th><th>Inizio</th><th>Attuale</th><th>&Delta;</th></tr></thead>
    <tbody id="recap-table"></tbody></table></div>
  </div>
</div>

<!-- TAB 3: PARTITE -->
<div id="tab-matches" class="hidden">
  <div class="card">
    <div class="row" style="margin-bottom:12px">
      <h2 style="margin:0;flex:1">Ultime Partite</h2>
      <select id="player-matches"></select>
    </div>
    <div id="matches-list"></div>
  </div>
</div>

<!-- TAB 4: GRAFICO -->
<div id="tab-overview" class="hidden">
  <div class="card">
    <div class="row" style="margin-bottom:8px">
      <select id="player"></select>
      <select id="key"></select>
    </div>
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <div class="row" style="gap:4px">
        <button class="refresh-btn ov-range-btn" onclick="setOverviewRange(2, this)">48h</button>
        <button class="refresh-btn ov-range-btn active" onclick="setOverviewRange(7, this)">7gg</button>
        <button class="refresh-btn ov-range-btn" onclick="setOverviewRange(30, this)">30gg</button>
        <button class="refresh-btn ov-range-btn" onclick="setOverviewRange(0, this)">Stagione / Tutto</button>
      </div>
      <button class="refresh-btn" style="padding:3px 8px;font-size:11px" onclick="chart && chart.resetZoom()">Reset zoom</button>
    </div>
    <div style="height:300px;position:relative;touch-action:pan-y"><canvas id="chart"></canvas></div>
  </div>
  <div class="card">
    <h2>Ultime variazioni</h2>
    <div class="wrap"><table><thead><tr><th>Ora</th><th>Statistica</th><th>Prima</th><th>Dopo</th><th>&Delta;</th></tr></thead>
    <tbody id="events"></tbody></table></div>
  </div>
</div>

<!-- TAB 5: MAPPE -->
<div id="tab-maps" class="hidden"></div>

<nav class="nav-bar">
  <button class="tab active" data-tab="compare"><span>&#x1F465;</span>Squadra</button>
  <button class="tab" data-tab="recap"><span>&#x1F4CA;</span>Resoconto</button>
  <button class="tab" data-tab="matches"><span>&#x1F3AE;</span>Partite</button>
  <button class="tab" data-tab="overview"><span>&#x1F4C8;</span>Grafico</button>
  <button class="tab" data-tab="maps"><span>&#x1F5FA;&#xFE0F;</span>Mappe</button>
</nav>

<script>
  window.APP_ENV = 'dev';
  const v = Date.now();
  const sm = document.createElement('script');
  sm.src = 'maps.dev.js?v=' + v;
  sm.onload = () => {
    const s = document.createElement('script');
    s.src = 'app.dev.js?v=' + v;
    document.body.appendChild(s);
  };
  document.body.appendChild(sm);
</script>
</body>
</html>

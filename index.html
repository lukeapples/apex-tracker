<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#e0463a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <title>Apex Squad Tracker</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#121418;--card:#1b1e24;--fg:#eceef2;--mut:#8f96a3;--bd:#2b303b;--acc:#e0463a;--up:#1ea653;--down:#e0463a;--warn:#e5a93b}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{font:14px/1.45 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg);max-width:960px;margin:0 auto;padding:14px 14px 76px}
    h1{font-size:20px;margin:0}
    h2{font-size:15px;margin:0 0 10px;font-weight:600}
    .mut{color:var(--mut);font-size:12px}
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .refresh-btn{background:var(--card);border:1px solid var(--bd);color:var(--fg);padding:6px 12px;border-radius:8px;font-size:13px;cursor:pointer}
    .map-bar{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;font-size:12px}
    .map-pill{display:inline-flex;align-items:center;gap:6px}
    .nav-bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:100}
    .tab{border:0;background:transparent;color:var(--mut);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;flex:1}
    .tab span{font-size:18px}
    .tab.active{color:var(--acc)}
    .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    select{font:inherit;padding:8px 10px;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:8px;flex:1;min-width:140px}
    .kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
    @media(min-width:600px){.kpi-grid{grid-template-columns:repeat(4,1fr)}}
    .kpi{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
    .kpi-title{font-size:11px;color:var(--mut);text-transform:uppercase}
    .kpi-val{font-size:20px;font-weight:700;margin-top:2px}
    .up{color:var(--up);font-weight:600}.down{color:var(--down);font-weight:600}
    table{border-collapse:collapse;width:100%}
    td,th{border-bottom:1px solid var(--bd);padding:8px 6px;text-align:left;font-size:13px;vertical-align:middle}
    th{color:var(--mut);font-size:11px;text-transform:uppercase}
    .group-row td{background:var(--bg);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--acc);padding:10px 8px;border-top:1px solid var(--bd)}
    .wrap{overflow-x:auto}
    .day-header{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--acc);padding:10px 4px 6px;margin-top:8px;border-bottom:1px solid var(--bd);margin-bottom:8px}
    .day-header:first-child{margin-top:0;padding-top:2px}
    .match-card{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
    .time-pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--fg);background:var(--card);border:1px solid var(--bd);padding:2px 7px;border-radius:6px;margin-top:4px;font-variant-numeric:tabular-nums}
    .badge{display:inline-block;padding:3px 8px;border-radius:8px;font-size:12px;font-weight:700;background:var(--card);border:1px solid var(--bd)}
    .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
    .dot-game{background:var(--up);box-shadow:0 0 6px var(--up)}
    .dot-lobby{background:var(--warn)}
    .dot-off{background:#5c6370}
    .status-line{display:flex;align-items:center;font-size:11px;color:var(--mut);margin-top:2px}
    .rank-icon{width:34px;height:34px;object-fit:contain;vertical-align:middle;display:block}
    .player-meta{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
    .prog-wrap{width:100%;max-width:220px}
    .prog-bar{height:6px;background:var(--card);border-radius:4px;overflow:hidden;margin-top:4px;border:1px solid var(--bd)}
    .prog-fill{height:100%;background:var(--acc);border-radius:4px}
    .hidden{display:none}
  </style>
</head>
<body>

<div class="header">
  <div>
    <h1>Apex Squad Tracker</h1>
    <div class="mut" id="sub">Caricamento dati...</div>
  </div>
  <button class="refresh-btn" onclick="loadData()">&#x21bb; Aggiorna</button>
</div>

<div class="map-bar hidden" id="map-bar"></div>

<!-- TAB 1: Squadra -->
<div id="tab-compare">
  <div class="card">
    <h2>Panoramica Squadra</h2>
    <div class="wrap"><table>
      <thead><tr><th>Giocatore</th><th>Grado</th><th>RP</th><th>RP Oggi</th><th>Kill</th><th>Partite</th></tr></thead>
      <tbody id="compare-table"></tbody>
    </table></div>
  </div>
  <div class="card">
    <h2>Andamento RP</h2>
    <div style="height:280px;position:relative"><canvas id="chart-compare"></canvas></div>
  </div>
</div>

<!-- TAB 2: RESOCONTO -->
<div id="tab-recap" class="hidden">
  <div class="card">
    <div class="row" style="margin-bottom:10px">
      <select id="player-recap"></select>
      <select id="period-recap">
        <option value="day">Oggi</option>
        <option value="week">Questa settimana</option>
        <option value="month">Questo mese</option>
      </select>
    </div>
    <div class="player-meta" id="recap-meta"></div>
    <div class="kpi-grid" id="recap-kpis"></div>
    <div class="wrap"><table><thead><tr><th>Statistica</th><th>Inizio</th><th>Attuale</th><th>&Delta;</th></tr></thead>
    <tbody id="recap-table"></tbody></table></div>
  </div>
</div>

<!-- TAB 3: PARTITE -->
<div id="tab-matches" class="hidden">
  <div class="card">
    <div class="row" style="margin-bottom:12px">
      <h2 style="margin:0;flex:1">Ultime Partite</h2>
      <select id="player-matches"></select>
    </div>
    <div id="matches-list"></div>
  </div>
</div>

<!-- TAB 4: GRAFICO -->
<div id="tab-overview" class="hidden">
  <div class="card">
    <div class="row" style="margin-bottom:12px">
      <select id="player"></select>
      <select id="key"></select>
    </div>
    <div style="height:300px;position:relative"><canvas id="chart"></canvas></div>
  </div>
  <div class="card">
    <h2>Ultime variazioni</h2>
    <div class="wrap"><table><thead><tr><th>Ora</th><th>Statistica</th><th>Prima</th><th>Dopo</th><th>&Delta;</th></tr></thead>
    <tbody id="events"></tbody></table></div>
  </div>
</div>

<nav class="nav-bar">
  <button class="tab active" data-tab="compare"><span>&#x1F465;</span>Squadra</button>
  <button class="tab" data-tab="recap"><span>&#x1F4CA;</span>Resoconto</button>
  <button class="tab" data-tab="matches"><span>&#x1F3AE;</span>Partite</button>
  <button class="tab" data-tab="overview"><span>&#x1F4C8;</span>Grafico</button>
</nav>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

let D = { status: {}, changes: [], maps: null };
const $ = id => document.getElementById(id);
const fmt = t => new Date(t * 1000).toLocaleString('it-IT', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const fmtTime = t => new Date(t * 1000).toLocaleTimeString('it-IT', {hour:'2-digit',minute:'2-digit'});
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

const STAT_MAP = {
  'rank_score': 'Punti Rango (RP)',
  'level': 'Livello Account',
  'kills': 'Uccisioni',
  'specialEvent_kills': 'Uccisioni Stagionali',
  'damage': 'Danni Inflitti',
  'specialEvent_damage': 'Danni Stagionali',
  'wins': 'Vittorie',
  'games_played': 'Partite Giocate',
  'top_3': 'Top 3',
  'top_5': 'Top 5',
  'headshots': 'Colpi alla Testa',
  'finishers': 'Esecuzioni',
  'revives': 'Rianimazioni',
  'respawns': 'Respawn',
  'assists': 'Assist',
  'knockdowns': 'Atterramenti',
  'sniper_kills': 'Uccisioni Cecchino',
  'care_package_kills': 'Uccisioni Armi Capsula',
  'double_time_distance': 'Distanza Doppio Passo',
  'smoke_grenade_enemies_hit': 'Nemici Colpiti Fumo',
  'phase_walk_time': 'Tempo Fase',
  'rifts_squadmates_phased': 'Alleati nel Portale',
  'enemies_scanned': 'Nemici Scansionati',
  'doc_drone_healing': 'Cure Drone D.O.C.',
  'doc_drone_squadmates_revived': 'Rianimazioni Drone',
  'tactical_shield_applied': 'Scudi Tattici Applicati',
  'passive_savior_boosted_distance_covered': 'Distanza Passiva Salvatrice',
  'teammates_lifted': 'Alleati Sollevati',
  'ultimate_boosted_travel_distance': 'Distanza Palla Demolitrice',
  'tactical_damage_blocked': 'Danni Bloccati Scudo',
  'motherlode_captured': 'Nemici Intrappolati',
  'squadmates_use_jumppad': 'Salti Trampolino',
  'passive_health_regen': 'Salute Rigenerata',
  'tactical_enemy_tethered': 'Nemici Intrappolati'
};

function shortStatLabel(k) {
  if (STAT_MAP[k]) return STAT_MAP[k];
  if (k.startsWith('total.')) {
    const sub = k.slice(6);
    return STAT_MAP[sub] || sub.replace(/_/g, ' ');
  }
  if (k.startsWith('legend.')) {
    const s = k.split('.').slice(2).join('.');
    return STAT_MAP[s] || s.replace(/_/g, ' ');
  }
  return k;
}

function labelKey(k) {
  if (STAT_MAP[k]) return STAT_MAP[k];
  if (k.startsWith('total.')) return 'Generale \u2014 ' + shortStatLabel(k);
  if (k.startsWith('legend.')) {
    const leg = k.split('.')[1];
    return leg + ' \u2014 ' + shortStatLabel(k);
  }
  return k;
}

function isValidDelta(key, diff) {
  if (key !== 'rank_score' && diff <= 0) return false;
  if ((key.endsWith('.kills') || key.endsWith('.specialEvent_kills')) && diff > 35) return false;
  if ((key.endsWith('.damage') || key.endsWith('.specialEvent_damage')) && diff > 8000) return false;
  if (key.endsWith('.games_played') && diff > 20) return false;
  return true;
}

function getRealtimeBadge(p) {
  if (!p) return '<span class="dot dot-off"></span>Offline';
  if (p.is_in_game) {
    const txt = p.state_text ? esc(p.state_text) : 'In partita';
    return `<span class="dot dot-game"></span>${txt}`;
  }
  if (p.is_online) {
    const txt = p.state_text ? esc(p.state_text) : 'In lobby';
    return `<span class="dot dot-lobby"></span>${txt}`;
  }
  return '<span class="dot dot-off"></span>Offline';
}

function getRankVisual(p) {
  const label = p.rank ? esc(p.rank + ' ' + (p.rank_div || '')) : '\u2014';
  if (p.rank_img) {
    return `<img src="${esc(p.rank_img)}" alt="${label}" title="${label}" class="rank-icon">`;
  }
  return label;
}

// Restituisce chiave univoca YYYY-MM-DD ed etichetta leggibile considerando il reset alle 04:00
function getGamingDayInfo(ts) {
  const shifted = new Date((ts - 4 * 3600) * 1000);
  const nowShifted = new Date(Date.now() - 4 * 3600 * 1000);
  const yestShifted = new Date(Date.now() - 28 * 3600 * 1000);

  const key = `${shifted.getFullYear()}-${String(shifted.getMonth() + 1).padStart(2, '0')}-${String(shifted.getDate()).padStart(2, '0')}`;
  const todayKey = `${nowShifted.getFullYear()}-${String(nowShifted.getMonth() + 1).padStart(2, '0')}-${String(nowShifted.getDate()).padStart(2, '0')}`;
  const yestKey = `${yestShifted.getFullYear()}-${String(yestShifted.getMonth() + 1).padStart(2, '0')}-${String(yestShifted.getDate()).padStart(2, '0')}`;

  if (key === todayKey) return { key, label: 'Oggi' };
  if (key === yestKey) return { key, label: 'Ieri' };

  const label = shifted.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
  return { key, label: label.charAt(0).toUpperCase() + label.slice(1) };
}

const RANK_TIERS = [
  { name: 'Bronze IV', rp: 1000, color: '#a66838' },
  { name: 'Silver IV', rp: 3000, color: '#9aa4b0' },
  { name: 'Gold IV', rp: 5400, color: '#d4af37' },
  { name: 'Platinum IV', rp: 8200, color: '#39b8c4' },
  { name: 'Diamond IV', rp: 11400, color: '#3b7be3' },
  { name: 'Master', rp: 15000, color: '#a349e5' }
];

const rankBandsPlugin = {
  id: 'rankBands',
  afterDraw(chart) {
    if ($('key').value !== 'rank_score') return;
    const { ctx, chartArea: { left, right, top, bottom }, scales: { y } } = chart;
    ctx.save();
    RANK_TIERS.forEach(t => {
      const yPos = y.getPixelForValue(t.rp);
      if (yPos >= top && yPos <= bottom) {
        ctx.beginPath();
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = t.color + '88';
        ctx.moveTo(left, yPos);
        ctx.lineTo(right, yPos);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = t.color;
        ctx.font = 'bold 11px system-ui';
        ctx.textAlign = 'right';
        ctx.fillText(t.name, right - 4, yPos - 4);
      }
    });
    ctx.restore();
  }
};

let chart, compareChart;
let activeTab = 'compare';

document.querySelectorAll('.tab').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeTab = btn.dataset.tab;
    ['compare', 'recap', 'matches', 'overview'].forEach(t => $('tab-' + t).classList.toggle('hidden', t !== activeTab));
    updateHeaderSub();
    if (activeTab === 'compare') renderCompare();
    if (activeTab === 'overview') renderOverview();
  };
});

async function loadData() {
  try {
    const res = await fetch('data.json?t=' + Date.now());
    const raw = await res.json();
    D.status = raw.status || {};
    D.changes = (raw.changes || []).filter(c => c[3] === null || Math.round(c[3] * 100) !== Math.round(c[4] * 100));
    D.maps = raw.maps || null;
    renderMaps();
    initSelectors();
    fillKeys();
    renderAll();
  } catch (e) {
    $('sub').textContent = 'In attesa della prima sincronizzazione cloud...';
  }
